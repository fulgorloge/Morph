<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Morph - El Planeta del Tesoro 3D</title>
  <style>
    * { box-sizing: border-box; user-select: none; touch-action: none; }
    body { 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      background: radial-gradient(circle at 50% 30%, #4a0072 0%, #03000a 100%); 
      font-family: system-ui, -apple-system, sans-serif; 
    }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    .ui-layer { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      pointer-events: none; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      align-items: center; 
      padding: 30px 20px; 
    }
    .badge { 
      background: rgba(255, 255, 255, 0.15); 
      backdrop-filter: blur(15px); 
      border: 1px solid rgba(255, 255, 255, 0.3); 
      border-radius: 20px; 
      padding: 8px 18px; 
      color: #ffdaf7; 
      font-size: 0.85rem; 
      letter-spacing: 2px; 
      text-transform: uppercase; 
      font-weight: 800; 
    }
    .dialog-box { 
      background: rgba(255, 255, 255, 0.2); 
      backdrop-filter: blur(20px); 
      border: 1px solid rgba(255, 255, 255, 0.4); 
      border-radius: 25px; 
      padding: 16px 30px; 
      color: #fff; 
      font-size: 1.2rem; 
      font-weight: 700; 
      text-align: center; 
      pointer-events: auto; 
      cursor: pointer; 
      transition: transform 0.15s ease; 
    }
    .dialog-box:active { transform: scale(0.95); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="ui-layer">
    <div class="badge">Morph - El Planeta del Tesoro</div>
    <div class="dialog-box" id="dialog" onclick="triggerTransform()">¡Haz clic para cambiar de color! ✨</div>
  </div>

  <script>
    let scene, camera, renderer, morphGroup, bodyMesh, eyeLeft, eyeRight, pupilL, pupilR;
    let basePositions = [];
    let clock = new THREE.Clock();
    let pos = new THREE.Vector2(0, 0), vel = new THREE.Vector2(0, 0);
    let isDragging = false, lastMousePos = new THREE.Vector2();
    let squish = { x: 0, y: 0, vx: 0, vy: 0 };

    init();
    animate();

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 7);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Luces de la escena
      const ambientLight = new THREE.AmbientLight(0xff60c0, 1.8);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
      mainLight.position.set(5, 8, 5);
      scene.add(mainLight);

      const backLight = new THREE.DirectionalLight(0x00ffff, 1.5);
      backLight.position.set(-5, -5, -2);
      scene.add(backLight);

      morphGroup = new THREE.Group();
      scene.add(morphGroup);

      // Geometría y deformación de Morph
      const geometry = new THREE.SphereGeometry(1.3, 64, 64);
      const posAttr = geometry.attributes.position;

      for (let i = 0; i < posAttr.count; i++) {
        let x = posAttr.getX(i);
        let y = posAttr.getY(i);
        let z = posAttr.getZ(i);

        // Darle la forma de gota/cresta clásica de Morph
        if (y > 0.1) {
          x *= 1.15;
          y *= 1.25;
        }

        posAttr.setXYZ(i, x, y, z);
        basePositions.push(new THREE.Vector3(x, y, z));
      }
      geometry.computeVertexNormals();

      // Material gelatinoso y traslúcido
      const material = new THREE.MeshPhysicalMaterial({
        color: 0xff3399,
        emissive: 0x550022,
        roughness: 0.1,
        transmission: 0.7,
        transparent: true,
        opacity: 0.95,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
      });

      bodyMesh = new THREE.Mesh(geometry, material);
      morphGroup.add(bodyMesh);

      // Ojos de Morph
      const eyeGeo = new THREE.SphereGeometry(0.32, 32, 32);
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
      const pupilGeo = new THREE.SphereGeometry(0.14, 32, 32);
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

      eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
      eyeLeft.position.set(-0.4, 0.35, 1.05);
      eyeLeft.scale.set(1, 1.2, 0.7);

      pupilL = new THREE.Mesh(pupilGeo, pupilMat);
      pupilL.position.set(0, 0, 0.23);
      eyeLeft.add(pupilL);

      eyeRight = new THREE.Mesh(eyeGeo, eyeMat);
      eyeRight.position.set(0.4, 0.35, 1.05);
      eyeRight.scale.set(1, 1.2, 0.7);

      pupilR = new THREE.Mesh(pupilGeo, pupilMat);
      pupilR.position.set(0, 0, 0.23);
      eyeRight.add(pupilR);

      morphGroup.add(eyeLeft);
      morphGroup.add(eyeRight);

      // Eventos
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', () => isDragging = false);
    }

    function triggerTransform() {
      squish.vx = 1.8;
      squish.vy = 1.8;
      const colors = [0xff3399, 0x00d2ff, 0xffcc00, 0x00ff88];
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      bodyMesh.material.color.setHex(randomColor);
    }

    function updatePhysics() {
      if (!isDragging) {
        vel.y -= 0.008; // Gravedad
        pos.add(vel);

        // Rebotes en los bordes
        if (pos.y < -1.8) {
          pos.y = -1.8;
          vel.y *= -0.7;
          squish.vy = Math.abs(vel.y) * 2;
        }
        if (Math.abs(pos.x) > 2.2) {
          pos.x = Math.sign(pos.x) * 2.2;
          vel.x *= -0.7;
          squish.vx = Math.abs(vel.x) * 2;
        }
      }

      // Sistema de muelle elástico (efecto gelatina)
      const k = 0.15, d = 0.82;
      squish.vx = (squish.vx - k * squish.x) * d;
      squish.x += squish.vx;
      squish.vy = (squish.vy - k * squish.y) * d;
      squish.y += squish.vy;
    }

    function updateGeometry(time) {
      const posAttr = bodyMesh.geometry.attributes.position;

      for (let i = 0; i < posAttr.count; i++) {
        const base = basePositions[i];
        const wave = Math.sin(time * 4 + base.x * 2 + base.y * 2) * 0.05;

        let x = base.x * (1 + squish.x * 0.3 + wave);
        let y = base.y * (1 / (1 + squish.y * 0.3) + wave);
        let z = base.z * (1 + wave);

        posAttr.setXYZ(i, x, y, z);
      }
      posAttr.needsUpdate = true;
      bodyMesh.geometry.computeVertexNormals();
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      updatePhysics();
      updateGeometry(time);

      morphGroup.position.set(pos.x, pos.y + Math.sin(time * 2.5) * 0.08, 0);
      morphGroup.rotation.z = -vel.x * 0.5;

      renderer.render(scene, camera);
    }

    function onPointerDown(e) {
      isDragging = true;
      vel.set(0, 0);
      lastMousePos.set(e.clientX, e.clientY);
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const current = new THREE.Vector2(e.clientX, e.clientY);
      const delta = current.clone().sub(lastMousePos);

      pos.x += delta.x * 0.008;
      pos.y -= delta.y * 0.008;
      vel.set(delta.x * 0.008, -delta.y * 0.008);

      // Movimiento ligero de las pupilas al arrastrar
      pupilL.position.x = pupilR.position.x = Math.max(-0.08, Math.min(0.08, delta.x * 0.01));
      pupilL.position.y = pupilR.position.y = Math.max(-0.08, Math.min(0.08, -delta.y * 0.01));

      lastMousePos.copy(current);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
