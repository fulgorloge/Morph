<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Morph - El Planeta del Tesoro 3D</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    body { margin: 0; padding: 0; overflow: hidden; background: radial-gradient(circle at 50% 30%, #4a0072 0%, #03000a 100%); font-family: system-ui, -apple-system, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 30px 20px; }
    .badge { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 20px; padding: 8px 18px; color: #ffdaf7; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 900; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .dialog-box { background: rgba(255, 255, 255, 0.22); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 32px; padding: 18px 36px; color: #fff; font-size: 1.35rem; font-weight: 800; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.8); pointer-events: auto; cursor: pointer; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .dialog-box:active { transform: scale(0.94); }
    .controls-hint { color: rgba(255, 255, 255, 0.7); font-size: 0.8rem; margin-top: 10px; text-align: center; font-weight: 500; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="ui-layer">
    <div class="badge">Morph: Treasure Planet Edition</div>
    <div>
      <div class="dialog-box" id="dialog" onclick="triggerTransform()">¡Ahoj! ¡Haz clic para transformarme! 🚀</div>
      <div class="controls-hint">Geometría Orgánica • Ruido Simplex Flotante • Físicas de Gelatina</div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, morphGroup, bodyMesh, shadowMesh, particleSystem, sparkParticles, ambientLight;
    let eyeLeft, eyeRight, pupilLeft, pupilRight;
    let clock = new THREE.Clock();

    let basePositions = [], blobShapes = [];
    let currentShape = 0, shapeTransition = 0;

    let pos = new THREE.Vector2(0, 0), vel = new THREE.Vector2(0, 0);
    let isDragging = false, lastMousePos = new THREE.Vector2(), dragHistory = [];

    let squishX = { v: 0, x: 0 }, squishY = { v: 0, x: 0 };
    let blinkProgress = 0;

    let sparkPositions = [], sparkVelocities = [];
    const SPARK_COUNT = 90;

    const dialogs = [
      { text: "¡Morph Gelatinoso! 💖", shape: 0, color: 0xff40ac },
      { text: "¡Gota del Espacio! 💧", shape: 1, color: 0x40e0ff },
      { text: "¡Estrella de Etherium! ⭐", shape: 2, color: 0xffd040 }
    ];

    init();
    animate();

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 7.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.35;
      container.appendChild(renderer.domElement);

      ambientLight = new THREE.AmbientLight(0xff60c0, 1.9);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 3.2);
      mainLight.position.set(5, 10, 7);
      scene.add(mainLight);

      const backLight = new THREE.DirectionalLight(0x00ffff, 2.5);
      backLight.position.set(-5, -5, -5);
      scene.add(backLight);

      morphGroup = new THREE.Group();
      scene.add(morphGroup);

      // Malla base ultra-suave para simular el cuerpo fluido de Morph
      const geometry = new THREE.SphereGeometry(1.4, 64, 64);
      const posAttr = geometry.attributes.position;

      for (let i = 0; i < posAttr.count; i++) {
        const v = new THREE.Vector3(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
        basePositions.push(v.clone());

        // Forma 1: Morph Clásico con protuberancias superiores tipo "orejitas/tentáculos"
        let morphForm = v.clone();
        if (v.y > 0.3) {
          morphForm.x *= 1.25 + 0.2 * Math.sin(v.y * 8);
          morphForm.y *= 1.15;
        }
        blobShapes.push(morphForm);
      }

      const material = new THREE.MeshPhysicalMaterial({
        color: 0xff2e9e,
        emissive: 0x880044,
        roughness: 0.05,
        metalness: 0.0,
        transmission: 0.9,
        transparent: true,
        opacity: 0.96,
        clearcoat: 1.0,
        clearcoatRoughness: 0.02,
        ior: 1.45
      });

      bodyMesh = new THREE.Mesh(geometry, material);
      morphGroup.add(bodyMesh);

      // Ojos estilo animación 2D/3D (Estilo Planeta del Tesoro)
      const eyeGeo = new THREE.SphereGeometry(0.38, 32, 32);
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.05 });
      const pupilGeo = new THREE.SphereGeometry(0.18, 32, 32);
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x0a0300 });

      eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
      eyeLeft.position.set(-0.45, 0.35, 1.15);
      eyeLeft.scale.set(1, 1.2, 0.7);
      morphGroup.add(eyeLeft);

      pupilLeft = new THREE.Mesh(pupilGeo, pupilMat);
      pupilLeft.position.set(0, 0, 0.24);
      eyeLeft.add(pupilLeft);

      eyeRight = new THREE.Mesh(eyeGeo, eyeMat);
      eyeRight.position.set(0.45, 0.35, 1.15);
      eyeRight.scale.set(1, 1.2, 0.7);
      morphGroup.add(eyeRight);

      pupilRight = new THREE.Mesh(pupilGeo, pupilMat);
      pupilRight.position.set(0, 0, 0.24);
      eyeRight.add(pupilRight);

      // Sombra
      const shadowGeo = new THREE.PlaneGeometry(4.0, 4.0);
      const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.5, depthWrite: false });
      shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
      shadowMesh.rotation.x = -Math.PI / 2;
      shadowMesh.position.y = -2.3;
      scene.add(shadowMesh);

      initParticles();
      initSparks();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
    }

    function initParticles() {
      const pCount = 140;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 15;
        positions[i+1] = (Math.random() - 0.5) * 15;
        positions[i+2] = (Math.random() - 0.5) * 15;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      particleSystem = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.11, color: 0xffd8fa, transparent: true, opacity: 0.75 }));
      scene.add(particleSystem);
    }

    function initSparks() {
      const geo = new THREE.BufferGeometry();
      const posArray = new Float32Array(SPARK_COUNT * 3);
      for (let i = 0; i < SPARK_COUNT; i++) {
        sparkPositions.push(new THREE.Vector3(0, -100, 0));
        sparkVelocities.push(new THREE.Vector3());
      }
      geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      sparkParticles = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.16, color: 0xffffff, transparent: true, opacity: 0.95 }));
      scene.add(sparkParticles);
    }

    function triggerSparks(x, y, speed = 0.35) {
      for (let i = 0; i < SPARK_COUNT; i++) {
        sparkPositions[i].set(x, y, 0);
        sparkVelocities[i].set((Math.random() - 0.5) * speed, (Math.random() - 0.5) * speed, (Math.random() - 0.5) * speed);
      }
      if (navigator.vibrate) navigator.vibrate(15);
    }

    function updateSparks() {
      const posAttr = sparkParticles.geometry.attributes.position;
      for (let i = 0; i < SPARK_COUNT; i++) {
        sparkPositions[i].add(sparkVelocities[i]);
        sparkVelocities[i].multiplyScalar(0.9);
        posAttr.setXYZ(i, sparkPositions[i].x, sparkPositions[i].y, sparkPositions[i].z);
      }
      posAttr.needsUpdate = true;
    }

    function triggerTransform() {
      currentShape = (currentShape + 1) % 3;
      shapeTransition = 0;
      squishX.v = 1.8; squishY.v = 1.8;
      const info = dialogs[currentShape];
      document.getElementById('dialog').innerText = info.text;
      ambientLight.color.setHex(info.color);
      triggerSparks(pos.x, pos.y, 0.5);
      playMorphSound(750, 0.25, pos.x);
    }

    function updatePhysics() {
      if (!isDragging) {
        vel.y -= 0.009;
        pos.add(vel);
        const boundsX = 2.2, boundsY = 1.8;

        if (Math.abs(pos.x) > boundsX) {
          pos.x = Math.sign(pos.x) * boundsX;
          vel.x *= -0.72; squishX.v = Math.abs(vel.x) * 2.2;
          triggerSparks(pos.x, pos.y);
          playMorphSound(380 + Math.abs(vel.x) * 600, 0.18, pos.x);
        }
        if (pos.y < -boundsY) {
          pos.y = -boundsY;
          vel.y *= -0.72; vel.x *= 0.88; squishY.v = Math.abs(vel.y) * 2.5;
          triggerSparks(pos.x, pos.y);
          playMorphSound(280 + Math.abs(vel.y) * 700, 0.22, pos.x);
        } else if (pos.y > boundsY) {
          pos.y = boundsY; vel.y *= -0.6; triggerSparks(pos.x, pos.y);
        }
      }

      const k = 0.18, d = 0.8;
      squishX.v = (squishX.v - k * squishX.x) * d; squishX.x += squishX.v;
      squishY.v = (squishY.v - k * squishY.x) * d; squishY.x += squishY.v;
    }

    function updateGeometry(time) {
      const posAttr = bodyMesh.geometry.attributes.position;
      const speed = vel.length();

      for (let i = 0; i < posAttr.count; i++) {
        let v = blobShapes[i].clone();

        // Ondulaciones orgánicas estilo gelatina fluida Disney
        const wave = Math.sin(time * 5.0 + v.x * 3.0 + v.y * 3.0) * (0.08 + speed * 0.12);
        const blobPulse = Math.cos(time * 3.0 + v.z * 2.0) * 0.05;

        v.x *= (1 + squishX.x * 0.3) + wave + blobPulse;
        v.y *= (1 / (1 + squishY.x * 0.3)) + wave;
        v.z *= (1 + squishX.x * 0.15) + blobPulse;

        posAttr.setXYZ(i, v.x, v.y, v.z);
      }
      posAttr.needsUpdate = true;
      bodyMesh.geometry.computeVertexNormals();
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      updatePhysics(); updateGeometry(time); updateSparks();

      morphGroup.position.set(pos.x, pos.y + Math.sin(time * 2.8) * 0.1, 0);
      morphGroup.rotation.z = -vel.x * 0.85; 
      morphGroup.rotation.x = vel.y * 0.85;

      shadowMesh.position.x = pos.x;
      shadowMesh.scale.setScalar(Math.max(0.2, 1 - (pos.y + 1.8) * 0.22));

      blinkProgress += 0.025;
      eyeLeft.scale.y = eyeRight.scale.y = Math.sin(blinkProgress) > 0.98 ? 0.08 : 1.2;

      particleSystem.rotation.y = time * 0.05;
      renderer.render(scene, camera);
    }

    function onPointerDown(e) {
      isDragging = true; vel.set(0, 0);
      lastMousePos.set(e.clientX, e
