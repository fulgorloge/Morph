<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Morph Cam 3D Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #webcam { position: absolute; width: 100vw; height: 100vh; object-fit: cover; opacity: 0.35; z-index: 1; }
    #canvas-container { position: absolute; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
    .ui-layer {
      position: absolute; z-index: 3; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 30px 20px;
      pointer-events: none;
    }
    .badge {
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px;
      padding: 8px 18px; color: #ffdaf7; font-size: 0.85rem; font-weight: 800; letter-spacing: 1.5px;
    }
    .scan-btn {
      background: linear-gradient(135deg, #ff3399, #7928ca);
      border: none; border-radius: 30px; padding: 16px 36px; color: #fff;
      font-size: 1.1rem; font-weight: 700; pointer-events: auto; cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 51, 153, 0.5); transition: transform 0.2s;
    }
    .scan-btn:active { transform: scale(0.95); }
  </style>
  <!-- Three.js & COCO-SSD (IA de visión) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>
  <div id="canvas-container"></div>

  <div class="ui-layer">
    <div class="badge" id="status">Cargando Cámara e IA...</div>
    <button class="scan-btn" onclick="scanAndTransform()">¡Escanear y Transformar! 📸</button>
  </div>

  <script>
    let scene, camera, renderer, morphMesh;
    let modelIA;
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status');

    initCamera();
    init3D();

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        modelIA = await cocoSsd.load();
        statusText.innerText = "Morph está listo para escanear ✨";
      } catch (err) {
        statusText.innerText = "Error al acceder a la cámara";
      }
    }

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 6);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 2.5);
      light.position.set(3, 5, 4);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xff3399, 1.5));

      const geo = new THREE.SphereGeometry(1.2, 32, 32);
      const mat = new THREE.MeshPhysicalMaterial({ color: 0xff3399, roughness: 0.1, transmission: 0.8, transparent: true });
      morphMesh = new THREE.Mesh(geo, mat);
      scene.add(morphMesh);

      animate();
    }

    async function scanAndTransform() {
      if (!modelIA) return;
      statusText.innerText = "Buscando objeto...";
      const predictions = await modelIA.detect(video);

      if (predictions.length > 0) {
        const detected = predictions[0].class;
        statusText.innerText = "Morph vio: " + detected + "! 🔮";
        transformToShape(detected);
      } else {
        statusText.innerText = "¡No reconozco el objeto! *bloop*";
      }
    }

    function transformToShape(type) {
      // Deformación de malla 3D dinámica según el tipo detectado
      const pos = morphMesh.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        if (type.includes("cup") || type.includes("bottle")) {
          y *= 1.8; x *= 0.7; z *= 0.7; // Forma alargada/vaso
        } else if (type.includes("cell phone") || type.includes("book")) {
          x *= 1.5; y *= 0.8; z *= 0.2; // Forma plana/teléfono
        } else {
          x *= 1.2; y *= 1.2; z *= 1.2; // Forma inflada
        }
        pos.setXYZ(i, x, y, z);
      }
      pos.needsUpdate = true;
      morphMesh.geometry.computeVertexNormals();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (morphMesh) morphMesh.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
